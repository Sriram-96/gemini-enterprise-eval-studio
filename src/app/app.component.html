<div *ngIf="isAuthChecked">
  <!-- Authenticated view -->
  <div *ngIf="isAuthenticated" class="flex h-screen bg-gray-50 text-gray-900">
    <!-- Sidebar -->
    <app-sidebar></app-sidebar>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- Header -->
      <app-header></app-header>

      <!-- Content Area -->
      <main class="flex-1 overflow-auto p-6 bg-gray-50 [scrollbar-gutter:stable]" tabindex="0" aria-label="Main content">
        <app-run-queries [hidden]="currentTab !== 'queries'"></app-run-queries>
        <app-run-evaluation [hidden]="currentTab !== 'run'"></app-run-evaluation>
        <app-compare-evals [hidden]="currentTab !== 'compare'"></app-compare-evals>
        <app-about [hidden]="currentTab !== 'about'"></app-about>
      </main>
    </div>
  </div>

  <!-- Unauthenticated view -->
  <div *ngIf="!isAuthenticated" class="flex items-center justify-center h-screen bg-gray-100">
    <div class="bg-white p-8 rounded-lg shadow-md max-w-md w-full text-center">
      <h2 class="text-2xl font-bold mb-6 text-gray-800">Sign in to Eval Studio</h2>
      <!-- Loading state -->
      <div *ngIf="isLoadingProviders" class="text-gray-500 py-4 flex items-center justify-center space-x-2">
        <svg class="animate-spin h-5 w-5 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Loading sign-in options...</span>
      </div>

      <!-- Loaded state -->
      <div *ngIf="!isLoadingProviders">
        <div *ngIf="providers.length > 0; else noProviders" class="space-y-4">
          <div *ngFor="let provider of providers">
            <button (click)="loginWithProvider(provider.id)" 
                    class="w-full px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition">
              {{ provider.display_name }}
            </button>
          </div>
        </div>
        <ng-template #noProviders>
          <p class="text-red-600">No authentication providers configured. Check server configuration.</p>
        </ng-template>
      </div>
    </div>
  </div>
</div>
