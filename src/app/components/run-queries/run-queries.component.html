<div class="space-y-6">
  <!-- Wizard Steps -->
  <div class="flex items-center justify-center space-x-4 mb-6">
    <button
      (click)="goToStep(1)"
      [disabled]="!isStepSelectable(1)"
      [ngClass]="{
        'text-blue-600 font-semibold': step === 1,
        'text-gray-500 hover:text-gray-700': step !== 1 && isStepSelectable(1),
        'text-gray-300 cursor-not-allowed': !isStepSelectable(1)
      }"
      class="focus:outline-none transition-colors"
    >
      1. Configuration
    </button>
    <div class="text-gray-300">/</div>
    <button
      (click)="goToStep(2)"
      [disabled]="!isStepSelectable(2)"
      [ngClass]="{
        'text-blue-600 font-semibold': step === 2,
        'text-gray-500 hover:text-gray-700': step !== 2 && isStepSelectable(2),
        'text-gray-300 cursor-not-allowed': !isStepSelectable(2)
      }"
      class="focus:outline-none transition-colors"
    >
      2. Upload & Run
    </button>
    <div class="text-gray-300">/</div>
    <button
      (click)="goToStep(3)"
      [disabled]="!isStepSelectable(3)"
      [ngClass]="{
        'text-blue-600 font-semibold': step === 3,
        'text-gray-500 hover:text-gray-700': step !== 3 && isStepSelectable(3),
        'text-gray-300 cursor-not-allowed': !isStepSelectable(3)
      }"
      class="focus:outline-none transition-colors"
    >
      3. Results
    </button>
  </div>

  <!-- Error Banner -->
  <div *ngIf="errorMessage" class="bg-red-50 border-l-4 border-red-400 p-4 rounded-md">
    <div class="flex">
      <div class="flex-shrink-0">
        <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
        </svg>
      </div>
      <div class="ml-3">
        <p class="text-sm text-red-700">
          {{ errorMessage }}
        </p>
      </div>
    </div>
  </div>

  <!-- Configuration Form -->
  <div [hidden]="step !== 1">
    <app-config-form [isRunQueries]="true" (next)="nextStep()"></app-config-form>
  </div>

  <!-- File Upload -->
  <div [hidden]="step !== 2">
    <app-file-upload
      [(file)]="responseFile"
      [(csvRows)]="responseCsvRows"
      (prev)="prevStep()"
      (run)="startResponseGeneration($event)"
      [instruction]="'CSV file with at least \'query\' column, plus an optional \'agent\' column to send a row to a custom agent'"
      [buttonText]="'Run Queries'"
      [requiredColumns]="['query']"
    ></app-file-upload>
  </div>

  <!-- Progress Bar -->
  <app-progress-bar
    *ngIf="isProcessingResponse"
    [progress]="responseProgress"
    [text]="'Generating responses... (' + completedRows + ' / ' + totalRows + ')'"
    [canStop]="true"
    (stop)="stopResponseGeneration()"
  ></app-progress-bar>

  <!-- Results Table -->
  <div [hidden]="step !== 3">
    <app-csv-table
      [data]="responseResults"
      [columns]="columns"
      [rowErrorKey]="'errorCode'"
      [title]="'Query Results'"
      [exportFileName]="'query_results'"
    >
      <button
        footer
        (click)="prevStep()"
        class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-50 transition-colors font-medium"
      >
        Back to Upload
      </button>
    </app-csv-table>
  </div>
</div>
